# TEMPLATE ONLY — no Fly app has been created. Replace app name/region, then see README "Deploy to Fly".
app = "citad3l-REPLACE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies Prisma migrations before new machines take traffic
  release_command = "node node_modules/prisma/build/index.js migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  INFERENCE_PROVIDER = "openai"
  # Non-secret config; secrets go in `fly secrets set` (see .env.example)

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
